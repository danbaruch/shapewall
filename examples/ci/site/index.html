<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Home | Tiny Shop</title>
    <style>
      body {
        margin: 0;
        font:
          16px/1.5 system-ui,
          sans-serif;
        color: #1c1917;
        background: #fafaf9;
      }
      header {
        display: flex;
        justify-content: space-between;
        padding: 16px 24px;
        background: #fff;
        border-bottom: 1px solid #e7e5e4;
      }
      nav a {
        margin-left: 16px;
        color: #1c1917;
      }
      main {
        max-width: 720px;
        margin: 0 auto;
        padding: 32px 24px;
      }
      .clock {
        font-variant-numeric: tabular-nums;
        color: #57534e;
      }
      .plan {
        padding: 24px;
        background: #fff;
        border: 1px solid #e7e5e4;
        border-radius: 12px;
      }
      .price {
        font-size: 40px;
        font-weight: 700;
      }
      .buy {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>Tiny Shop</strong>
      <nav><a href="/">Home</a><a href="/pricing">Pricing</a><a href="/about">About</a></nav>
    </header>
    <main>
      <h1>Notes that keep up with you</h1>
      <p>Write it down, find it again. Server time: <span class="clock">{{clock}}</span></p>
    </main>
  </body>
</html>
