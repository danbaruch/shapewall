<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your password -- Lumen Notes</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <a class="logo" href="/"><img src="/img/logo.svg" alt="" />Lumen Notes</a>
        <nav class="nav" aria-label="Main">
          <a href="/features/">Features</a>
          <a href="/pricing/">Pricing</a>
          <a href="/templates/">Templates</a>
          <a href="/blog/">Blog</a>
        </nav>
        <div class="header-cta">
          <a class="btn btn-ghost" href="/login/">Sign in</a>
          <a class="btn btn-primary" href="/signup/">Start free</a>
          <button class="btn btn-ghost menu-button" type="button" aria-label="Open menu">Menu</button>
        </div>
      </div>
    </header>
    <main>
      <section class="auth">
        <form method="post" action="/reset" aria-label="Reset your password">
          <h1 class="form-title">Reset your password</h1>
          <p class="meta" style="margin: 0">We will email you a link. It works for one hour.</p>
          <label>Email <input type="email" name="email" value="reader@example.com" /></label>
          <button class="btn btn-primary" type="submit" data-testid="reset-submit">Send the link</button>
          <div class="alert alert-info">Sent. Check your inbox, then <a href="/login/">sign in</a>.</div>
        </form>
      </section>
    </main>
  </body>
</html>
