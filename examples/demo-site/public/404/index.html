<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found -- Lumen Notes</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <a class="logo" href="/"><img src="/img/logo.svg" alt="" />Lumen Notes</a>

          <a href="/features/">Features</a>
          <a href="/pricing/">Pricing</a>
          <a href="/templates/">Templates</a>
          <a href="/blog/">Blog</a>
        </nav>
        <div class="header-cta">
          <a class="btn btn-ghost" href="/login/">Sign in</a>

          <button class="btn btn-ghost menu-button" type="button" aria-label="Open menu">Menu</button>

      </div>

    <main>
      <section class="error-page">
        <div>
          <p class="error-code" aria-hidden="true">404</p>

            <a class="btn btn-primary" href="/" data-testid="home-link">Go home</a><a class="btn btn-ghost" href="/blog/">Read the blog</a>
          </div>
        </div>
      </section>
    </main>
    <footer class="site-footer">
      <div class="wrap">
        <span>Lumen Notes is a fictional product for the Shapewall demo.</span
        ><span><a href="/pricing/">Pricing</a> · <a href="/changelog/">Changelog</a> · <a href="/blog/">Blog</a></span>
