<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Welcome -- Lumen Notes</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <a class="logo" href="/"><img src="/img/logo.svg" alt="" />Lumen Notes</a>
        <div class="header-cta"><a class="btn btn-ghost" href="/app/">Skip setup</a></div>
      </div>
    </header>
    <main>
      <section class="onboard">
        <h1 class="form-title">You are in. Start with a blank page or a template.</h1>
        <p class="lead">One step instead of three: everything else can wait.</p>
        <div class="choices">
          <a class="choice selected" href="/app/note/"><b>Blank page</b><span class="meta">Just start typing</span></a>
          <a class="choice" href="/templates/"><b>From a template</b><span class="meta">Twelve to pick from</span></a>
        </div>
        <div class="onboard-actions"><a class="btn btn-primary" href="/app/">Go to my notes</a></div>
      </section>
    </main>
  </body>
</html>
