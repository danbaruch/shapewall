<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in -- Lumen Notes</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <a class="logo" href="/"><img src="/img/logo.svg" alt="" />Lumen Notes</a>
        <nav class="nav" aria-label="Main">
          <a href="/features/">Features</a>
          <a href="/pricing/">Pricing</a>
          <a href="/templates/">Templates</a>
          <a href="/blog/">Blog</a>
        </nav>
        <div class="header-cta">
          <a class="btn btn-ghost" href="/login/">Sign in</a>
          <a class="btn btn-primary" href="/signup/">Start free</a>
          <button class="btn btn-ghost menu-button" type="button" aria-label="Open menu">Menu</button>
        </div>
      </div>
    </header>
    <main>
      <section class="auth">
        <form method="post" action="/session" aria-label="Sign in">
          <h1 style="font-size: 28px; margin: 0">Welcome back</h1>
          <p class="meta" style="margin: 0">Sign in to your notes.</p>
          <input type="hidden" name="csrf_token" value="demo-csrf-token-must-not-be-captured" />
          <label>Email <input type="email" name="email" autocomplete="email" placeholder="you@example.com" /></label>
          <label>Password <input type="password" name="password" value="demo-password-must-not-be-captured" /></label>
          <button class="btn btn-primary" type="submit" onclick="alert('demo')">Sign in</button>
          <p class="meta" style="margin: 0">New here? <a href="/signup/">Create an account</a></p>
        </form>
      </section>
    </main>
  </body>
</html>
