name: Publish

# Publishes the package to npm when a version tag (v1.2.3) is pushed, or when a
# maintainer starts this workflow for an existing tag. It uses npm trusted
# publishing: npm trusts this workflow in this repository directly (OpenID
# Connect), so there is no npm token to store and nobody approves a release by
# hand. Each release carries a provenance statement naming the commit it was
# built from.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to publish, such as v1.2.3
        required: true

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@^11.5.1
      - name: The tag matches the package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match package.json version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Skip when this version is already on npm
        id: exists
        run: |
          if npm view "shapewall@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "shapewall@$VERSION is already on npm"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.exists.outputs.published == 'false'
        run: npm ci
      - if: steps.exists.outputs.published == 'false'
        run: npm run lint
      # Tags cut before the test fixtures created this folder themselves still need it.
      - run: mkdir -p "$HOME/.cache"
      - if: steps.exists.outputs.published == 'false'
        name: Unit tests with a per-file deadline
        run: npm run pretest && node --test --test-concurrency=4 --test-timeout=120000 test/*.test.js
      - if: steps.exists.outputs.published == 'false'
        run: npm run build
      - if: steps.exists.outputs.published == 'false'
        name: Package contents
        run: npm run check:pack
      - if: steps.exists.outputs.published == 'false'
        run: npm publish --provenance --access public

  release:
    name: GitHub release
    needs: npm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Create the release from the changelog entry, if there is none yet
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          printf '\nInstall: `npm install --save-dev shapewall`. Live demo: https://shapewall.com/demo/ · Docs: https://shapewall.com/docs\n' >> notes.md
          gh release create "$TAG" --title "Shapewall $version" --notes-file notes.md --verify-tag
