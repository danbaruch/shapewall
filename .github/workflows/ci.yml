name: CI

# Runs when a maintainer starts it from the Actions tab. Contributors run the
# same checks locally (CONTRIBUTING.md); add pull_request and push triggers
# here to run them on every change.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test, build (Node 22)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Full package tests with a per-file deadline
        run: npm run pretest && node --test --test-concurrency=4 --test-timeout=120000 test/*.test.js
        timeout-minutes: 10
      - run: npm run build
      - name: Package contents (no tests, fixtures or captures in the tarball)
        run: npm run check:pack

  e2e:
    name: End to end (Playwright Chromium)
    # The full browser suite.
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify sandboxed audit Chromium startup
        run: bash scripts/ci-chrome-sandbox.sh
      - run: npm run build
      - run: npm run build:demo
      - run: npm run test:e2e
        env:
          SHAPEWALL_SHOTS: e2e-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          retention-days: 3
          path: e2e-screenshots
          if-no-files-found: ignore

  website:
    name: Website (build and SEO checks)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm test
